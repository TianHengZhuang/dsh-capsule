[project]
name = "dsh-capsule-runtime"
version = "0.1.0"
description = "DSH Capsule Python Runtime (trusted core)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "docker>=7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "dsh-capsule-sdk",
]

[tool.uv.sources]
dsh-capsule-sdk = { path = "../sdk/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
dsh-capsule-runtime = "dsh_capsule.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsh_capsule"]
