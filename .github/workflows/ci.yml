name: CI
# 作用：CI 基线（AGENTS.md）——Guard 主链路（纯 TypeScript）必须在 ubuntu / windows / macos
# 三平台跑 build + test（Legacy Python Runtime 已按项目决策移除，无 Python/Docker 依赖）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  guard-ts:
    name: Guard TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
