if" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Managed Broker</text><rect x="790" y="465" width="170" height="48" rx="24.0" fill="#2A335B" stroke="#536083"/><text x="875.0" y="494.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Fail Closed</text><rect x="990" y="465" width="205" height="48" rx="24.0" fill="#2A335B" stroke="#536083"/><text x="1092.5" y="494.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Pure TypeScript</text><rect x="370" y="565" width="315" height="112" rx="18" fill="#1B2447" stroke="#3B496E" stroke-width="1.2"/><text x="392" y="603" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Zero-change lease layer</text><text x="392" y="637" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#C7D3F4" text-anchor="start"><tspan x="392" dy="0">Only augments downstream ASK;</tspan><tspan x="392" dy="17.5">preserves ALLOW/DENY</tspan></text><rect x="720" y="565" width="315" height="112" rx="18" fill="#1B2447" stroke="#3B496E" stroke-width="1.2"/><text x="742" y="603" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Controlled provider execution</text><text x="742" y="637" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#C7D3F4" text-anchor="start"><tspan x="742" dy="0">Resolve credentials per</tspan><tspan x="742" dy="17.5">operation; never cache secrets</tspan></text><rect x="