<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11142B"/><stop offset="0.5" stop-color="#1E2550"/><stop offset="1" stop-color="#0A5161"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5267FF"/><stop offset="1" stop-color="#00A8C6"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7257F5"/><stop offset="1" stop-color="#A85AF0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2352" flood-opacity="0.13"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5267FF"/></marker>
</defs>
<rect width="100%" height="100%" rx="28" fill="#F7F8FC"/>
<text x="80" y="75" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="800" fill="#101828" text-anchor="start" opacity="1">Universal Mode：把一次 allowed-once 变成明确范围的短期 Lease</text><text x="80" y="112" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="start" opacity="1">前提：下游 DSH 策略已经决定 ask；Guard 永远不会覆盖 deny。</text><rect x="85" y="210" width="235" height="165" rx="22" fill="#EEF2FF" stroke="#5267FF" stroke-width="1.7" filter="url(#shadow)"/><rect x="105" y="230" width="42" height="32" rx="16.0" fill="#5267FF" stroke="none"/><text x="126.0" y="251.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text><text x="105" y="300" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">Tool Call</text><text x="105" y="336" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#5D6577" text-anchor="start"><tspan x="105" dy="0">工具调用</tspan></text><rect x="385" y="210" width="235" height="165" rx="22" fill="#F7F3FF" stroke="#8B5CF6" stroke-width="1.7" filter="url(#shadow)"/><rect x="405" y="230" width="42" height="32" rx="16.0" fill="#8B5CF6" stroke="none"/><text x="426.0" y="251.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text><text x="405" y="300" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">DSH Policy</text><text x="405" y="336" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#5D6577" text-anchor="start"><tspan x="405" dy="0">下游返回 ask</tspan></text><rect x="685" y="210" width="235" height="165" rx="22" fill="#EFFAF8" stroke="#0A9F88" stroke-width="1.7" filter="url(#shadow)"/><rect x="705" y="230" width="42" height="32" rx="16.0" fill="#0A9F88" stroke="none"/><text x="726.0" y="251.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><text x="705" y="300" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">Lease Match</text><text x="705" y="336" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#5D6577" text-anchor="start"><tspan x="705" dy="0">Session + Tool +</tspan><tspan x="705" dy="18.75">Scope</tspan></text><rect x="985" y="210" width="235" height="165" rx="22" fill="#FFF8EE" stroke="#E28A17" stroke-width="1.7" filter="url(#shadow)"/><rect x="1005" y="230" width="42" height="32" rx="16.0" fill="#E28A17" stroke="none"/><text x="1026.0" y="251.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">4</text><text x="1005" y="300" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">Approval</text><text x="1005" y="336" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#5D6577" text-anchor="start"><tspan x="1005" dy="0">allowed-once</tspan></text><rect x="1285" y="210" width="235" height="165" rx="22" fill="#FFF2F6" stroke="#D44C7D" stroke-width="1.7" filter="url(#shadow)"/><rect x="1305" y="230" width="42" height="32" rx="16.0" fill="#D44C7D" stroke="none"/><text x="1326.0" y="251.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">5</text><text x="1305" y="300" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">Lease</text><text x="1305" y="336" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#5D6577" text-anchor="start"><tspan x="1305" dy="0">签发并在 TTL 内复用</tspan></text><path d="M320 292 L372 292" stroke="#8A94A6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 292 L672 292" stroke="#8A94A6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M920 292 L972 292" stroke="#8A94A6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1220 292 L1272 292" stroke="#8A94A6" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="480" width="1000" height="185" rx="22" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="1.5"/><text x="335" y="525" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#172033" text-anchor="start" opacity="1">关键语义</text><text x="340" y="565" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="800" fill="#D92D20" text-anchor="start" opacity="1">DENY</text><text x="440" y="565" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#4C5568" text-anchor="start" opacity="1">永远透传，不可被 Lease 覆盖</text><text x="340" y="599" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="800" fill="#027A48" text-anchor="start" opacity="1">ALLOW</text><text x="440" y="599" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#4C5568" text-anchor="start" opacity="1">原样透传，不制造额外审批</text><text x="340" y="633" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="800" fill="#4F46E5" text-anchor="start" opacity="1">ASK</text><text x="440" y="633" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#4C5568" text-anchor="start" opacity="1">有匹配 Lease → allow；否则继续 ask，并在批准后签发 Lease</text></svg>