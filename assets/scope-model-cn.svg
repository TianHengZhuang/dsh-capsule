<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11142B"/><stop offset="0.5" stop-color="#1E2550"/><stop offset="1" stop-color="#0A5161"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5267FF"/><stop offset="1" stop-color="#00A8C6"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7257F5"/><stop offset="1" stop-color="#A85AF0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2352" flood-opacity="0.13"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5267FF"/></marker>
</defs>
<rect width="100%" height="100%" rx="28" fill="#F7F8FC"/>
<text x="80" y="75" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="800" fill="#101828" text-anchor="start" opacity="1">Scope 模型：越具体，授权复用面越小</text><text x="80" y="112" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="start" opacity="1">Universal Mode 默认 exact-arguments；Managed Mode 使用 provider + resource + action 的语义 Scope。</text><rect x="80" y="195" width="335" height="350" rx="24" fill="#EEF2FF" stroke="#5267FF" stroke-width="1.6" filter="url(#shadow)"/><rect x="104" y="222" width="142" height="34" rx="17.0" fill="#5267FF" stroke="none"/><text x="175.0" y="244.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">默认 / 最保守</text><text x="104" y="305" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="23" font-weight="800" fill="#172033" text-anchor="start" opacity="1">exact-arguments</text><text x="104" y="352" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Scope key</text><text x="104" y="387" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600" fill="#3C465B" text-anchor="start"><tspan x="104" dy="0">SHA-256(tool + canonical</tspan><tspan x="104" dy="20.25">JSON(args))</tspan></text><text x="104" y="462" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Reuse</text><text x="104" y="496" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#3C465B" text-anchor="start"><tspan x="104" dy="0">仅完全相同参数可复用</tspan></text><rect x="455" y="195" width="335" height="350" rx="24" fill="#EFFAF8" stroke="#0A9F88" stroke-width="1.6" filter="url(#shadow)"/><rect x="479" y="222" width="142" height="34" rx="17.0" fill="#0A9F88" stroke="none"/><text x="550.0" y="244.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">显式配置</text><text x="479" y="305" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="23" font-weight="800" fill="#172033" text-anchor="start" opacity="1">fields</text><text x="479" y="352" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Scope key</text><text x="479" y="387" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600" fill="#3C465B" text-anchor="start"><tspan x="479" dy="0">tool + selected fields</tspan></text><text x="479" y="462" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Reuse</text><text x="479" y="496" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#3C465B" text-anchor="start"><tspan x="479" dy="0">忽略未纳入 Scope 的参数变化</tspan></text><rect x="830" y="195" width="335" height="350" rx="24" fill="#FFF8EE" stroke="#E28A17" stroke-width="1.6" filter="url(#shadow)"/><rect x="854" y="222" width="142" height="34" rx="17.0" fill="#E28A17" stroke="none"/><text x="925.0" y="244.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">显式配置 / 最宽</text><text x="854" y="305" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="23" font-weight="800" fill="#172033" text-anchor="start" opacity="1">tool</text><text x="854" y="352" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Scope key</text><text x="854" y="387" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600" fill="#3C465B" text-anchor="start"><tspan x="854" dy="0">tool:&lt;name&gt;</tspan></text><text x="854" y="462" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Reuse</text><text x="854" y="496" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#3C465B" text-anchor="start"><tspan x="854" dy="0">同 Session 内该 Tool 均可复用</tspan></text><rect x="1205" y="195" width="335" height="350" rx="24" fill="#FFF2F6" stroke="#D44C7D" stroke-width="1.6" filter="url(#shadow)"/><rect x="1229" y="222" width="142" height="34" rx="17.0" fill="#D44C7D" stroke="none"/><text x="1300.0" y="244.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Managed Extension</text><text x="1229" y="305" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="23" font-weight="800" fill="#172033" text-anchor="start" opacity="1">managed</text><text x="1229" y="352" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Scope key</text><text x="1229" y="387" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600" fill="#3C465B" text-anchor="start"><tspan x="1229" dy="0">SHA-256(provider + resource +</tspan><tspan x="1229" dy="20.25">action)</tspan></text><text x="1229" y="462" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#7A8396" text-anchor="start" opacity="1">Reuse</text><text x="1229" y="496" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#3C465B" text-anchor="start"><tspan x="1229" dy="0">按业务语义资源复用</tspan></text><rect x="80" y="600" width="1440" height="90" rx="18" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="1.4"/><text x="110" y="642" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#D92D20" text-anchor="start" opacity="1">安全不变量</text><text x="285" y="642" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="600" fill="#4C5568" text-anchor="start" opacity="1">Lease 始终绑定 Session；agent/session 缺失时不创建全局或匿名 Lease。</text></svg>