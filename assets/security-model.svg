<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="DSH Capsule trust boundary and security model">
<defs><linearGradient id="t" x1="0" x2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f7f2ff"/></linearGradient><linearGradient id="u" x1="0" x2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fff1f2"/></linearGradient></defs>
<rect width="1400" height="560" rx="28" fill="#fbfcff"/><text x="70" y="70" font-family="Inter,Arial" font-size="36" font-weight="800" fill="#111827">Trust Boundary</text><text x="70" y="105" font-family="Inter,Arial" font-size="19" fill="#64748b">Keep long-term secrets on the trusted host. Treat every third-party Capsule as hostile.</text>
<rect x="70" y="145" width="830" height="340" rx="24" fill="url(#t)" stroke="#cbdcff" stroke-width="2"/><text x="100" y="185" font-family="Inter,Arial" font-size="21" font-weight="700" fill="#315fd5">TRUSTED HOST</text>
<g font-family="Inter,Arial" font-size="20" font-weight="650" fill="#1e293b">
<g transform="translate(110 225)"><rect width="210" height="100" rx="18" fill="white"/><text x="105" y="43" text-anchor="middle">DSH Adapter</text><text x="105" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">approval + credentials</text></g>
<g transform="translate(365 225)"><rect width="220" height="100" rx="18" fill="white"/><text x="110" y="43" text-anchor="middle">Python Runtime</text><text x="110" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">lifecycle + isolation</text></g>
<g transform="translate(630 225)"><rect width="220" height="100" rx="18" fill="white"/><text x="110" y="43" text-anchor="middle">Capability Broker</text><text x="110" y="72" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">lease + provider</text></g>
</g>
<g font-family="Inter,Arial" font-size="16" fill="#475569"><text x="132" y="385">✓ Session-bound approval</text><text x="390" y="385">✓ Isolated instances</text><text x="655" y="385">✓ Per-op credential resolve</text><text x="132" y="420">✓ No secret persistence</text><text x="390" y="420">✓ Timeout + output limit</text><text x="655" y="420">✓ Provider allowlist</text></g>
<rect x="940" y="145" width="390" height="340" rx="24" fill="url(#u)" stroke="#fed7aa" stroke-width="2"/><text x="970" y="185" font-family="Inter,Arial" font-size="21" font-weight="700" fill="#c2410c">UNTRUSTED CAPSULE</text>
<g transform="translate(1005 225)"><path d="M80 0 160 45 80 90 0 45Z" fill="#ffbd7a"/><path d="M0 45 80 90 80 180 0 135Z" fill="#f97316"/><path d="M160 45 80 90 80 180 160 135Z" fill="#ea580c"/></g>
<g font-family="Inter,Arial" font-size="17" fill="#7c2d12"><text x="970" y="430">No host files · No host env · No network</text><text x="970" y="458">No Docker socket · Read-only rootfs · Non-root</text></g>
<path d="M900 315h40" stroke="#64748b" stroke-width="4" stroke-dasharray="8 8"/><text x="920" y="300" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#64748b">UDS</text>
</svg>
