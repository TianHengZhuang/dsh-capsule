<rect width="100%" height="100%" rx="28" fill="#F7F8FC"/>
<text x="80" y="75" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="800" fill="#101828" text-anchor="start" opacity="1">Managed Mode: Broker executes privileged operations after capability validation</text><text x="80" y="112" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="start" opacity="1">Extensions describe intent; credential resolution and provider calls stay inside trusted Guard Core.</text><rect x="110" y="160" width="205" height="40" rx="20.0" fill="#EEF2FF" stroke="none"/><text x="212.5" y="185.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#3D4CC2" text-anchor="middle" opacity="1">Managed Extension</text><line x1="212" y1="210" x2="212" y2="780" stroke="#D8DEE9" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="500" y="160" width="205" height="40" rx="20.0" fill="#EEF2FF" stroke="none"/><text x="602.5" y="185.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#3D4CC2" text-anchor="middle" opacity="1">Capability Guard</text><line x1="602" y1="210" x2="602" y2="780" stroke="#D8DEE9" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="895" y="160" width="205" height="40" rx="20.0" fill="#EEF2FF" stroke="none"/><text x="997.5" y="185.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#3D4CC2" text-anchor="middle" opacity="1">Credential Service</text><line x1="997" y1="210" x2="997" y2="780" stroke="#D8DEE9" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="1285" y="160" width="205" height="40" rx="20.0" fill="#EEF2FF" stroke="none"/><text x="1387.5" y="185.0" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700" fill="#3D4CC2" text-anchor="middle" opacity="1">Provider</text><line x1="1387" y1="210" x2="1387" y2="780" stroke="#D8DEE9" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M212 235 L588 235" stroke="#5267FF" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="400.0" y="221" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">register(tool, provider, action, resource(args))</text><text x="400.0" y="259" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">register semantic capability</text><path d="M212 330 L588 330" stroke="#5267FF" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="400.0" y="316" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">execute(run, operation)</text><text x="400.0" y="354" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">submit controlled operation</text><path d="M602 425 L983 425" stroke="#D44C7D" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="792.5" y="411" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">resolve credentialRef</text><text x="792.5" y="449" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">resolve on every operation</text><path d="M997 520 L1373 520" stroke="#D44C7D" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="1185.0" y="506" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">credential</text><text x="1185.0" y="544" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">returned only to trusted Broker</text><path d="M602 615 L1373 615" stroke="#0A9F88" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="987.5" y="601" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">provider.execute(action, resource, payload)</text><text x="987.5" y="639" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">action allowlist + resource binding</text><path d="M1387 710 L616 710" stroke="#0A9F88" stroke-width="2.8" marker-end="url(#arrowBlue)" fill="none"/><text x="1001.5" y="696" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" font-weight="700" fill="#30384D" text-anchor="middle" opacity="1">sanitized result</text><text x="1001.5" y="734" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#717A8B" text-anchor="middle" opacity="1">result returns without secret</text><rect x="370" y="748" width="860" height="78" rx="18" fill="#F8FAFC" stroke="#DCE3EC" stroke-width="1.3"/><text x="800" y="796" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="600" fill="#4C5568" text-anchor="middle" opacity="1">Double-check: recompute the expected resource from run.arguments, then compare provider / action / resource end-to-end.</text></svg>