<rect width="100%" height="100%" rx="28" fill="#F7F8FC"/>
<text x="80" y="75" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="800" fill="#101828" text-anchor="start" opacity="1">Security boundary: authorization &amp; brokering, not an OS sandbox</text><text x="80" y="112" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#667085" text-anchor="start" opacity="1">An explicit “protects / does not protect” boundary is safer than overclaiming.</text><rect x="80" y="175" width="690" height="520" rx="26" fill="#F0FBF8" stroke="#0A9F88" stroke-width="1.6" filter="url(#shadow)"/><text x="120" y="225" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="800" fill="#087D6B" text-anchor="start" opacity="1">✓ Guard protects</text><text x="122" y="285" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="285" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Turn allowed-once into a scoped TTL</tspan><tspan x="150" dy="20.0">lease</tspan></text><text x="122" y="348" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="348" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Session / tool / scope binding and</tspan><tspan x="150" dy="20.0">revocation</tspan></text><text x="122" y="411" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="411" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Double-check managed</tspan><tspan x="150" dy="20.0">provider/action/resource</tspan></text><text x="122" y="474" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="474" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Provider action allowlists and per-op</tspan><tspan x="150" dy="20.0">credential resolution</tspan></text><text x="122" y="537" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="537" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Secret-safe audit and console</tspan><tspan x="150" dy="20.0">projections</tspan></text><text x="122" y="600" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#0A9F88" text-anchor="start" opacity="1">●</text><text x="150" y="600" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#405165" text-anchor="start"><tspan x="150" dy="0">Fail-closed behavior on critical</tspan><tspan x="150" dy="20.0">errors</tspan></text><rect x="830" y="175" width="690" height="520" rx="26" fill="#FFF5F5" stroke="#E85D5D" stroke-width="1.6" filter="url(#shadow)"/><text x="870" y="225" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="800" fill="#C63D3D" text-anchor="start" opacity="1">× Guard does not claim</text><text x="872" y="285" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="285" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">No Docker / Python / UDS isolated</tspan><tspan x="900" dy="20.0">runtime</tspan></text><text x="872" y="348" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="348" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">Universal Mode does not hide</tspan><tspan x="900" dy="20.0">credentials from arbitrary plugins</tspan></text><text x="872" y="411" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="411" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">Cannot force legacy plugins to route</tspan><tspan x="900" dy="20.0">network calls through Broker</tspan></text><text x="872" y="474" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="474" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">Not VM / microVM-grade malicious-code</tspan><tspan x="900" dy="20.0">isolation</tspan></text><text x="872" y="537" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="537" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">MemoryLeaseStore is not cross-process</tspan><tspan x="900" dy="20.0">durable</tspan></text><text x="872" y="600" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#E85D5D" text-anchor="start" opacity="1">●</text><text x="900" y="600" font-family="Noto Sans CJK SC,Inter,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="550" fill="#5A4650" text-anchor="start"><tspan x="900" dy="0">Real DSH/Cordis package-level</tspan><tspan x="900" dy="20.0">integration is still pending</tspan></text></svg>